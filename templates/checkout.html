<!-- checkout.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">


    <!-- Include any other necessary styles/scripts here -->
</head>

<body>

    <header>
        <h1 class="store-title">Threads and Co.</h1>
    </header>  

    <div class="content">
        <div class="checkout-form">
        <h2>Checkout</h2>
        <p>Enter your details to complete the checkout process.</p>

        <!-- Form for customer details -->
        <form method="post" action="{% url 'order-confirmation' %}">
            {% csrf_token %}
            <!-- Form for customer details -->
            <div class="form-group">
                <label for="customerName">Name:</label>
                <input type="text" id="customerName" name="customerName" required>
            </div>
        
            <div class="form-group">
                <label for="customerContact">Contact:</label>
                <input type="text" id="customerContact" name="customerContact" required>
            </div>
        
            <div class="form-group">
                <label for="customerAddress">Address:</label>
                <input type="text" id="customerAddress" name="customerAddress" required>
            </div>
                
            <button type="submit">Place Order</button>
        </form>
        
        </div>
    </div>

    <footer>
        &copy; 2023 Threads and Co.
    </footer>


</body>

</html>
